*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#d6d6d6}
#root{position:absolute;inset:0;overflow:hidden;background:radial-gradient(ellipse 80% 62% at 50% 42%,#f8f8f8 0%,#e7e7e7 55%,#c3c3c3 100%)}

.sc{position:absolute;inset:0;transform-origin:50% 45%}

.sel{position:absolute;border:3px dashed #1a1a1a}
.sel>i{position:absolute;width:24px;height:24px;border-radius:50%;background:#1a1a1a;box-shadow:0 4px 8px rgba(0,0,0,.25)}
.pol{position:absolute;transform-origin:50% 0}
.pol .card{position:absolute;inset:0;background:linear-gradient(170deg,#fff,#eeeeee);border-radius:6px;padding:20px 20px 0;box-shadow:0 34px 50px rgba(0,0,0,.28),0 6px 10px rgba(0,0,0,.12)}

  background:radial-gradient(circle at 40% 30%,#4a4a4a,#151515 75%);box-shadow:inset 0 0 40px rgba(0,0,0,.6)}

#cap{position:absolute;left:40px;right:40px;top:1575px;height:0}
.cl{position:absolute;left:0;right:0;top:0;translate:0 -50%;text-align:center;direction:rtl;font-family:Plex;font-weight:700;font-size:56px;line-height:1.5;color:#151515;
  text-shadow:0 0 18px rgba(255,255,255,.9),0 0 4px rgba(255,255,255,.9)}

.cw.lt{font-family:Inter;font-weight:800;direction:ltr;unicode-bidi:isolate;letter-spacing:-.01em}

#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 85% 72% at 50% 45%,transparent 52%,rgba(0,0,0,.30) 100%)}

<body>
<div id="root"><div id="cam"></div><div id="cap"></div><div id="vig"></div><div id="grain"></div><div id="fade"></div></div>
<script>
// ===================== engine =====================
const OFFSET = 0.35;          // seconds of picture before the VO starts
const FPS = 30;
const VO_END = 51.0;
const DURATION = 52.4;        // in VO time
window.TOTAL_FRAMES = Math.round((DURATION + OFFSET) * FPS);
window.META = {OFFSET, FPS, DURATION};

const E = {
  lin: p => p, out: p => 1 - (1 - p) ** 3, o5: p => 1 - (1 - p) ** 5, in: p => p * p * p,
  io: p => p < .5 ? 4 * p * p * p : 1 - (-2 * p + 2) ** 3 / 2,
  back: p => { const c = 1.9, c3 = c + 1; return 1 + c3 * (p - 1) ** 3 + c * (p - 1) ** 2; },
};
const vAt = (k, t) => {
  if (t <= k[0][0]) return k[0][1];
  for (let i = 1; i < k.length; i++) {
    if (t < k[i][0]) { const [t0, v0] = k[i - 1], [t1, v1, e] = k[i]; return v0 + (v1 - v0) * E[e || 'out']((t - t0) / (t1 - t0)); }
  }
  return k[k.length - 1][1];
};
const ANIM = [], SCENES = [], SHAKES = [], GLITCH = [], TYPERS = [];
window.SFX = [];
let CUR = null;
const sfx = (n, t, g = 1, d) => window.SFX.push({n, t: +(t + OFFSET).toFixed(3), g, d});
const hash = n => { const x = Math.sin(n * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); };

function A(el, ch) {
  if (!el._ch) { el._ch = {}; el._scene = CUR; ANIM.push(el); }
  for (const k in ch) el._ch[k] = (el._ch[k] || []).concat(ch[k]).sort((a, b) => a[0] - b[0]);
  return el;
}
function apply(el, t) {
  const c = el._ch, g = (k, d) => c[k] ? vAt(c[k], t) : d;
  const x = g('x', 0), y = g('y', 0), s = g('s', 1), r = g('r', 0), rx = g('rx', 0), ry = g('ry', 0), b = g('b', 0);
  el.style.transform = `translate(${x}px,${y}px)` + (rx || ry ? ` perspective(1400px) rotateX(${rx}deg) rotateY(${ry}deg)` : '') + ` rotate(${r}deg) scale(${s})`;
  el.style.opacity = g('o', 1);
  if (c.b) el.style.filter = b > .05 ? `blur(${b}px)` : 'none';
  if (c.cl) { const p = g('cl', 1); el.style.clipPath = p >= .999 ? 'none' : `inset(-20% -2% -20% ${(1 - p) * 102}%)`; }
  if (c.cr) { const p = g('cr', 1); el.style.clipPath = p >= .999 ? 'none' : `inset(-20% ${(1 - p) * 102}% -20% -2%)`; }

}
const svgNS = 'http://www.w3.org/2000/svg';

// --- presets ---
const IN = (e, t, {d = .5, y = 40, x = 0, s = 1.14, b = 14, r = 0, e: ez = 'o5'} = {}) =>
  A(e, {o: [[t, 0], [t + d * .55, 1, 'out']], y: [[t, y], [t + d, 0, ez]], x: [[t, x], [t + d, 0, ez]], s: [[t, s], [t + d, 1, ez]], b: [[t, b], [t + d * .8, 0, 'out']], r: [[t, r], [t + d, 0, ez]]});
const OUT = (e, t, {d = .35, y = -40, x = 0, s = .9, b = 12, r = 0} = {}) => {
  // Already faded out earlier: appending keys would interpolate it back into view.
  const o = e._ch?.o; if (o && o[o.length - 1][1] === 0 && o[o.length - 1][0] <= t) return e;
  return A(e, {o: [[t, 1], [t + d, 0, 'in']], y: [[t, 0], [t + d, y, 'in']], x: [[t, 0], [t + d, x, 'in']], s: [[t, 1], [t + d, s, 'in']], b: [[t, 0], [t + d, b, 'in']], r: [[t, 0], [t + d, r, 'in']]});
};

// Scene root: in/out transitions and visibility window.
function SC(t0, t1, {inFx = 'zoom', out = 'zoom', outT} = {}) {
  const root = el(document.getElementById('cam'), 'div', 'sc');
  CUR = root; root._t = [t0, t1]; SCENES.push(root);
  if (inFx === 'zoom') A(root, {o: [[t0, 0], [t0 + .22, 1, 'out']], s: [[t0, 1.08], [t0 + .55, 1, 'o5']], b: [[t0, 10], [t0 + .35, 0]]});
  outT = outT ?? t1 - .3;
  const d = t1 - outT;
  if (out === 'zoom') A(root, {o: [[outT, 1], [t1, 0, 'in']], s: [[outT, 1], [t1, 1.22, 'in']], b: [[outT, 0], [t1, 14, 'in']]});
  if (out === 'whipL') A(root, {x: [[outT, 0], [t1, -1100, 'in']], b: [[outT, 0], [t1, 26, 'in']]});
  if (out === 'whipU') A(root, {y: [[outT, 0], [t1, -1500, 'in']], b: [[outT, 0], [t1, 26, 'in']]});
  if (out === 'fall') A(root, {o: [[outT, 1], [t1, 0, 'in']], s: [[outT, 1], [t1, .86, 'in']], b: [[outT, 0], [t1, 10, 'in']]});

const shake = (t, amp) => SHAKES.push([t, amp]);

// --- typography ---
// W: a row of words, each revealed at its own (VO-synced) time.
function W(sc, y, list, cls, style = '', opt = {}) {
  const r = el(sc, 'div', 'row ' + cls, `top:${y}px;${style}`);
  list.forEach(([txt, t, extra], i) => {
    if (i) r.appendChild(document.createTextNode(' '));
    const w = el(r, 'span', 'w ' + (extra || ''), '', txt);
    IN(w, t - .06, {y: opt.y ?? 46, s: opt.s ?? 1.18, b: opt.b ?? 16, d: opt.d ?? .5});
  });
  if (opt.sfx !== false) sfx(opt.sfx || 'swish', list[0][1] - .08, opt.g ?? .45);
  return r;
}
// HL: words inside a black highlight bar that wipes in right-to-left.
function HL(sc, y, list, style = '', opt = {}) {
  const r = el(sc, 'div', 'row sans', `top:${y}px;${style}`);
  const bar = el(r, 'span', 'hl ca', '');
  A(bar, {cl: [[list[0][1] - .14, 0], [list[0][1] + .2, 1, 'o5']], o: [[list[0][1] - .15, 0], [list[0][1] - .14, 1, 'lin']]});
  list.forEach(([txt, t], i) => {
    if (i) bar.appendChild(document.createTextNode(' '));
    IN(el(bar, 'span', 'w', '', txt), t - .04, {y: 26, s: 1.1, b: 10, d: .4});
  });
  sfx('swish', list[0][1] - .14, opt.g ?? .5);
  return r;
}
// L: Latin text, letter by letter.
function L(sc, y, txt, t, cls, style = '', st = .035, x) {
  const r = el(sc, 'div', 'row ' + cls, `top:${y}px;direction:ltr;${x != null ? `left:${x}px;right:auto;translate:-50% -50%;` : ''}${style}`);
  [...txt].forEach((ch, i) => { const w = el(r, 'span', 'w', '', ch === ' ' ? '&nbsp;' : ch); IN(w, t + i * st, {y: 30, s: 1.35, b: 10, d: .4}); });
  return r;
}
function ribbon(sc, d, w, color, t, dur = .9, op = 1) {
  const s = document.createElementNS(svgNS, 'svg');
  s.setAttribute('width', 1080); s.setAttribute('height', 1920); s.setAttribute('class', 'a'); s.style.cssText = 'left:0;top:0;overflow:visible;filter:drop-shadow(0 18px 20px rgba(0,0,0,.25))';
  s.innerHTML = `<path d="${d}" pathLength="1" fill="none" stroke="${color}" stroke-width="${w}" stroke-linecap="round" stroke-dasharray="1 1" opacity="${op}"/>`;
  sc.appendChild(s);
  A(s.firstChild, {d: [[t, 0], [t + dur, 1, 'io']]});
  return s;
}
function dashed(sc, d, t, dur = .6, color = '#2a2a2a') {
  const s = document.createElementNS(svgNS, 'svg');
  s.setAttribute('width', 1080); s.setAttribute('height', 1920); s.setAttribute('class', 'a'); s.style.cssText = 'left:0;top:0';
  s.innerHTML = `<path d="${d}" fill="none" stroke="${color}" stroke-width="4" stroke-dasharray="14 12" opacity=".75"/>`;
  sc.appendChild(s); A(s, {cr: [[t, 0], [t + dur, 1, 'io']]});
  return s;
}
const STAR = 'M0,-100 C8,-14 14,-8 100,0 C14,8 8,14 0,100 C-8,14 -14,8 -100,0 C-14,-8 -8,-14 0,-100Z';
function star(sc, x, y, size, t, {fx = 0, fy = 0, rot = 120, color = '#151515', spin = 25} = {}) {
  const s = el(sc, 'div', 'a', `left:${x - size / 2}px;top:${y - size / 2}px;width:${size}px;height:${size}px`,
    `<svg viewBox="-100 -100 200 200" width="${size}" height="${size}" style="filter:drop-shadow(0 20px 18px rgba(0,0,0,.3))"><path d="${STAR}" fill="${color}"/></svg>`);
  A(s, {x: [[t, fx], [t + .7, 0, 'o5']], y: [[t, fy], [t + .7, 0, 'o5']], r: [[t, rot], [t + .7, 0, 'o5'], [t + 6, -spin, 'lin']], o: [[t, 0], [t + .15, 1, 'lin']]});
  return s;
}
function barcode(sc, x, y, t, w = 150, h = 48, seed = 3) {
  let bars = '', cx = 0, i = 0;
  while (cx < w) { const bw = 1 + Math.floor(hash(seed * 31 + i) * 4); if (i % 2 === 0) bars += `<rect x="${cx}" y="0" width="${bw}" height="${h}" fill="#1a1a1a"/>`; cx += bw + 1; i++; }
  const b = el(sc, 'div', 'a', `left:${x - w / 2}px;top:${y - h / 2}px`, `<svg width="${w}" height="${h}">${bars}</svg>`);
  A(b, {cl: [[t, 0], [t + .45, 1, 'io']]});
  return b;
}
function selBox(sc, cx, cy, w, h, t, color = '#1a1a1a') {
  const b = el(sc, 'div', 'sel', `left:${cx - w / 2}px;top:${cy - h / 2}px;width:${w}px;height:${h}px;border-color:${color}`);
  [[-13, -13], [w - 11, -13], [-13, h - 11], [w - 11, h - 11]].forEach(([x, y], i) => {
    const d = el(b, 'i', '', `left:${x - 3}px;top:${y - 3}px;background:${color}`);
    A(d, {s: [[t + .08 + i * .04, 0], [t + .3 + i * .04, 1, 'back']]});
  });
  A(b, {o: [[t, 0], [t + .12, 1, 'lin']], s: [[t, .72], [t + .4, 1, 'back']]});
  sfx('click', t, .7);
  return b;
}
function logo(sc, name, cx, cy, size, t, mode = 'drop', opt = {}) {
  const w = el(sc, 'div', 'a logo', `left:${cx - size / 2}px;top:${cy - size / 2}px;width:${size}px;height:${size}px`, `<img src="assets/logos/${name}.png">`);
  if (mode === 'drop') { A(w, {o: [[t, 0], [t + .1, 1, 'lin']], s: [[t, 1.7], [t + .5, 1, 'back']], b: [[t, 16], [t + .3, 0]], r: [[t, opt.r ?? 10], [t + .5, 0, 'back']]}); sfx('pop', t + .12, .8); sfx('impact', t + .14, .35); }
  if (mode === 'flip') { A(w, {o: [[t, 0], [t + .12, 1, 'lin']], ry: [[t, opt.ry ?? 95], [t + .65, 0, 'back']], s: [[t, .8], [t + .65, 1, 'back']], b: [[t, 8], [t + .3, 0]]}); sfx('whoosh', t - .05, .55); sfx('pop', t + .3, .6); }
  if (mode === 'slide') { A(w, {o: [[t, 0], [t + .1, 1, 'lin']], x: [[t, opt.x ?? -600], [t + .55, 0, 'o5']], r: [[t, opt.r ?? -25], [t + .7, 0, 'back']], b: [[t, 22], [t + .35, 0]]}); sfx('swish', t - .03, .7); sfx('impact', t + .4, .3); }
  if (mode === 'slam') { A(w, {o: [[t, 0], [t + .06, 1, 'lin']], s: [[t, 2.6], [t + .38, 1, 'o5']], b: [[t, 24], [t + .3, 0]]}); sfx('impact', t + .3, 1); sfx('boom', t + .3, .6); shake(t + .32, 16); }
  if (mode === 'pop') { A(w, {o: [[t, 0], [t + .08, 1, 'lin']], s: [[t, .2], [t + .45, 1, 'back']], y: [[t, 50], [t + .45, 0, 'o5']]}); sfx('pop', t + .05, .55); }
  if (opt.float) A(w, {y: Array.from({length: 14}, (_, i) => [t + .6 + i * .5, (i % 2 ? -1 : 1) * opt.float, 'io'])});
  return w;
}
const ICONS = {
  clapper: '<rect x="4" y="12" width="24" height="15" rx="2"/><path d="M4 12l1.5-6.5 22 0L26 12M11 5.5L9 12M17 5.5L15 12M23 5.5L21 12"/>',
  tv: '<rect x="3" y="8" width="26" height="17" rx="2.5"/><path d="M11 29h10M11 3l5 5 5-5"/><path d="M14 13l6 3.5-6 3.5z" fill="currentColor"/>',
  popcorn: '<path d="M8 14l3 15h10l3-15z"/><path d="M13.5 14l1 15M18.5 14l-1 15"/><circle cx="10.5" cy="11" r="3.2"/><circle cx="16" cy="8.5" r="3.8"/><circle cx="21.5" cy="11" r="3.2"/>',
  cap: '<path d="M2 12l14-6 14 6-14 6z"/><path d="M8 15v6c0 2.2 3.6 4 8 4s8-1.8 8-4v-6M28 13v8"/>',
  camera: '<rect x="3" y="9" width="18" height="14" rx="2.5"/><path d="M21 14l8-4v12l-8-4z"/><circle cx="9" cy="16" r="2.4" fill="currentColor"/>',
  brief: '<rect x="4" y="10" width="24" height="16" rx="3"/><path d="M12 10V6h8v4M4 17h24"/>',
  sofa: '<path d="M6 14v-3a3 3 0 0 1 3-3h14a3 3 0 0 1 3 3v3"/><path d="M4 14a2 2 0 0 1 4 0v3h16v-3a2 2 0 0 1 4 0v8H4z"/><path d="M7 22v3M25 22v3"/>',
  bulb: '<path d="M12 23h8M13 27h6M16 4a8 8 0 0 0-5 14.2c1 1 1.5 2.3 1.5 4.3h7c0-2 .5-3.3 1.5-4.3A8 8 0 0 0 16 4z"/>',
  rocket: '<path d="M16 3c5 3 7 8.5 6 15l-3 4h-6l-3-4c-1-6.5 1-12 6-15z"/><circle cx="16" cy="12" r="2.5"/><path d="M10 17l-4 4.5 1 4 4-3M22 17l4 4.5-1 4-4-3M14 26l2 4 2-4"/>',
  check: '<path d="M6 16.5l6.5 6.5L26 9"/>',
  send: '<path d="M4 15L28 4 21 28l-5-10zM16 18L28 4"/>',
  play: '<path d="M11 7l15 9-15 9z" fill="currentColor"/>',

const icon = (k, s, col = '#fff', sw = 2.2) => `<svg viewBox="0 0 32 32" width="${s}" height="${s}" fill="none" stroke="${col}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" style="color:${col}">${ICONS[k]}</svg>`;
function polaroid(sc, cx, top, w, h, ic, label, t, {fromY = -700, swing = 14} = {}) {
  const p = el(sc, 'div', 'pol', `left:${cx - w / 2}px;top:${top}px;width:${w}px;height:${h}px`);
  const ph = w - 40;
  el(p, 'div', 'card', '', `<div class="ph" style="height:${ph}px">${icon(ic, ph * .46, '#f2f2f2', 1.8)}</div><div class="lb" style="font-size:${w * .13}px;margin-top:${(h - ph - 20) * .14}px">${label}</div>`);
  el(p, 'div', 'a', `left:${w / 2 - 14}px;top:-46px`, `<svg width="28" height="74" viewBox="0 0 28 74"><path d="M8 70V12a6 6 0 0 1 12 0v50a3 3 0 0 1-6 0V18" fill="none" stroke="#777" stroke-width="3.5" stroke-linecap="round"/></svg>`);
  A(p, {y: [[t, fromY], [t + .55, 0, 'back']], o: [[t, 0], [t + .1, 1, 'lin']],

function typer(e, t0, t1) { e._full = e.textContent; e.textContent = ''; TYPERS.push([e, t0, t1]); sfx('type', t0, .5, t1 - t0); }

// ===================== captions =====================
const CAPS = [
  [0.00, [['اليوم', 0], ['كامل', .78], ['الأدوات', 1.32], ['اللي', 1.8], ['تحتاجها', 1.92]]],
  [2.62, [['تلقاهم', 2.62], ['في', 3.14], ['بلاصة', 3.36], ['وحدة!', 3.72]]],
  [4.48, [['CapCut', 4.48, 1], ['Pro،', 5.0, 1], ['ChatGPT،', 5.8, 1], ['Gemini', 6.96, 1], ['وحتى', 7.56], ['Netflix', 8.16, 1]]],

const grainFrames = (() => {

    g.putImageData(im, 0, 0); out.push(`url(${c.toDataURL('image/png')})`);
  }
  return out;
})();

  for (const e of ANIM) if (!e._scene || e._scene.style.display !== 'none') apply(e, t);
  for (const [e, t0, t1] of GLITCH) {
    if (t >= t0 && t <= t1) {

    } else if (e._g !== 0) { e.style.textShadow = ''; e.style.transform = ''; e.style.clipPath = ''; }
  }

  const p = Math.min(1, Math.max(0, (t - cur._t[0]) / (cur._t[1] - cur._t[0])));

  grain.style.backgroundImage = grainFrames[frame % 6];
  captions(t);
};

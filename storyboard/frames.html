<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:Plex;src:url(fonts/IBMPlexSansArabic-Light.ttf);font-weight:300}
@font-face{font-family:Plex;src:url(fonts/IBMPlexSansArabic-Regular.ttf);font-weight:400}
@font-face{font-family:Plex;src:url(fonts/IBMPlexSansArabic-SemiBold.ttf);font-weight:600}
@font-face{font-family:Plex;src:url(fonts/IBMPlexSansArabic-Bold.ttf);font-weight:700}
:root{--cyan:#22d3ff;--blue:#2f7bff;--violet:#8b5cff;--ink:#05060a;--glass:rgba(255,255,255,.06)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--ink)}
body{font-family:Plex,sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
.abs{position:absolute}
#stage{position:absolute;inset:0;overflow:hidden}
.bg{position:absolute;inset:0;background:
  radial-gradient(ellipse 70% 45% at 50% 38%,rgba(20,70,160,.38),transparent 70%),
  radial-gradient(ellipse 50% 35% at 85% 85%,rgba(139,92,255,.20),transparent 70%),
  radial-gradient(ellipse 45% 30% at 10% 10%,rgba(34,211,255,.10),transparent 70%),
  linear-gradient(180deg,#07080d 0%,#0b0d14 50%,#05060a 100%)}
.floor{position:absolute;left:-50%;width:200%;height:1100px;bottom:-260px;
  background-image:linear-gradient(rgba(34,211,255,.22) 2px,transparent 2px),linear-gradient(90deg,rgba(34,211,255,.22) 2px,transparent 2px);
  background-size:90px 90px;transform:perspective(700px) rotateX(72deg);transform-origin:50% 0;
  -webkit-mask-image:linear-gradient(180deg,transparent 0%,#000 35%,#000 60%,transparent 100%)}
canvas#fx{position:absolute;inset:0}
.vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 80% 70% at 50% 45%,transparent 55%,rgba(0,0,0,.85) 100%)}
.grain{position:absolute;inset:0;opacity:.07;mix-blend-mode:overlay}
.glass{background:linear-gradient(140deg,rgba(255,255,255,.11),rgba(255,255,255,.025) 60%);
  border:1.5px solid rgba(140,210,255,.28);border-radius:30px;backdrop-filter:blur(18px);
  box-shadow:0 40px 90px rgba(0,0,0,.65),inset 0 1.5px 0 rgba(255,255,255,.18),0 0 50px rgba(34,160,255,.14)}
.glow-c{box-shadow:0 0 0 1.5px rgba(34,211,255,.7),0 0 40px rgba(34,211,255,.45),0 40px 90px rgba(0,0,0,.6)}
.tag{font-family:Plex;font-weight:600;letter-spacing:.32em;font-size:22px;color:rgba(160,220,255,.75);direction:ltr;text-transform:uppercase}
.ar{direction:rtl;unicode-bidi:isolate}
.h-title{font-weight:700;font-size:88px;line-height:1.22;text-align:center;
  background:linear-gradient(180deg,#fff 0%,#e6f6ff 55%,#8fdcff 100%);-webkit-background-clip:text;color:transparent;
  filter:drop-shadow(0 0 22px rgba(34,211,255,.35)) drop-shadow(0 6px 0 rgba(0,0,0,.5))}
.titlebar{position:absolute;left:70px;right:70px;bottom:250px;display:flex;flex-direction:column;align-items:center;gap:18px}
.rule{height:3px;width:420px;background:linear-gradient(90deg,transparent,var(--cyan),var(--violet),transparent);box-shadow:0 0 18px var(--cyan)}
.badge{position:relative;font-weight:700;font-size:150px;line-height:1;direction:ltr}
.badge .ex{position:absolute;inset:0;color:#0b2747}
.badge .fr{position:relative;background:linear-gradient(180deg,#fff 0%,#d8f3ff 30%,#6fb7e4 48%,#1f5d93 52%,#cfefff 70%,#ffffff 100%);-webkit-background-clip:text;color:transparent}
.mono{font-family:'DejaVu Sans Mono',monospace;direction:ltr}
.chip{display:inline-flex;align-items:center;gap:12px;padding:12px 24px;border-radius:999px;font-size:24px;font-weight:600;
  background:rgba(34,211,255,.10);border:1.5px solid rgba(34,211,255,.5);color:#bff3ff}
.dot{width:12px;height:12px;border-radius:50%;background:var(--cyan);box-shadow:0 0 14px var(--cyan)}
.sweep{position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.18) 48%,rgba(160,230,255,.08) 52%,transparent 60%);mix-blend-mode:screen}
.lbl{font-size:24px;color:rgba(200,230,255,.7);font-weight:400}
.big{font-weight:700;font-size:54px}
.bar{border-radius:10px;background:linear-gradient(180deg,var(--cyan),var(--blue));box-shadow:0 0 20px rgba(34,211,255,.5)}
</style>
</head>
<body>
<div id="stage">
  <div class="bg"></div>
  <div class="floor" id="floor"></div>
  <canvas id="fx" width="1080" height="1920"></canvas>
  <div id="scene"></div>
  <svg class="grain" width="1080" height="1920"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
  <div class="vig"></div>
</div>
<script>
// ---------- helpers ----------
let seed = 7;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const S = document.getElementById('scene');
const add = (html) => S.insertAdjacentHTML('beforeend', html);
const n = location.hash.slice(1) || '1';
seed = 7 + [...n].reduce((a, c) => a + c.charCodeAt(0), 0) * 101;

function particles({count = 220, cx = 540, cy = 760, spread = 1, bokeh = 14, streaks = 0} = {}) {
  const c = document.getElementById('fx').getContext('2d');
  c.globalCompositeOperation = 'lighter';
  for (let i = 0; i < bokeh; i++) {
    const x = rnd() * 1080, y = rnd() * 1920, r = 30 + rnd() * 90;
    const g = c.createRadialGradient(x, y, 0, x, y, r);
    const col = rnd() > .7 ? '139,92,255' : '34,211,255';
    g.addColorStop(0, `rgba(${col},.16)`); g.addColorStop(.7, `rgba(${col},.06)`); g.addColorStop(1, `rgba(${col},0)`);
    c.fillStyle = g; c.beginPath(); c.arc(x, y, r, 0, 7); c.fill();
  }
  for (let i = 0; i < streaks; i++) {
    const a = rnd() * Math.PI * 2, r0 = 160 + rnd() * 300, r1 = r0 + 300 + rnd() * 900;
    const g = c.createLinearGradient(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0, cx + Math.cos(a) * r1, cy + Math.sin(a) * r1);
    const col = rnd() > .8 ? '170,140,255' : '120,220,255';
    g.addColorStop(0, `rgba(${col},0)`); g.addColorStop(.6, `rgba(${col},${.25 + rnd() * .5})`); g.addColorStop(1, `rgba(${col},0)`);
    c.strokeStyle = g; c.lineWidth = .8 + rnd() * 2.5;
    c.beginPath(); c.moveTo(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0); c.lineTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1); c.stroke();
  }
  for (let i = 0; i < count; i++) {
    const a = rnd() * Math.PI * 2, d = Math.pow(rnd(), .6) * 900 * spread;
    const x = cx + Math.cos(a) * d, y = cy + Math.sin(a) * d * 1.4, r = rnd() * 2.6 + .4;
    const g = c.createRadialGradient(x, y, 0, x, y, r * 4);
    const col = rnd() > .82 ? '180,150,255' : (rnd() > .5 ? '120,230,255' : '255,255,255');
    g.addColorStop(0, `rgba(${col},${.5 + rnd() * .5})`); g.addColorStop(1, `rgba(${col},0)`);
    c.fillStyle = g; c.beginPath(); c.arc(x, y, r * 4, 0, 7); c.fill();
  }
}
function badge(txt, size = 150) {
  let sh = [];
  for (let i = 1; i <= 16; i++) sh.push(`${i * .6}px ${i}px 0 hsl(212,70%,${22 - i * .9}%)`);
  sh.push('0 22px 30px rgba(0,0,0,.7)', '0 0 60px rgba(34,211,255,.35)');
  return `<div class="badge" style="font-size:${size}px"><span class="ex" style="text-shadow:${sh.join(',')}">${txt}</span><span class="fr">${txt}</span></div>`;
}
function title(num, text, tagline, extra = '') {
  add(`<div class="titlebar" style="${extra}">
    <div class="tag">${tagline}</div>
    ${num ? badge(num) : ''}
    <div class="h-title ar">${text}</div>
    <div class="rule"></div></div>`);
}
const ico = {
  mail: '<path d="M4 7h24v18H4z M4 7l12 10L28 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>',
  sheet: '<rect x="6" y="4" width="20" height="24" rx="2" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M6 12h20M6 20h20M14 4v24" stroke="currentColor" stroke-width="2"/>',
  chip: '<rect x="9" y="9" width="14" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M13 4v5M19 4v5M13 23v5M19 23v5M4 13h5M4 19h5M23 13h5M23 19h5" stroke="currentColor" stroke-width="2"/><circle cx="16" cy="16" r="2.5" fill="currentColor"/>',
  user: '<circle cx="16" cy="11" r="5.5" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M5 28c1.5-6 6-9 11-9s9.5 3 11 9" fill="none" stroke="currentColor" stroke-width="2.2"/>',
  chat: '<path d="M5 6h22v15H13l-6 5v-5H5z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>',
  cart: '<path d="M3 5h4l3 15h15l3-11H9" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><circle cx="12" cy="25" r="2" fill="currentColor"/><circle cx="23" cy="25" r="2" fill="currentColor"/>',
  bolt: '<path d="M18 3L7 18h8l-2 11 11-15h-8z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>',
  pen: '<path d="M6 26l3-9L21 5l6 6-12 12z M17 9l6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>',
  play: '<circle cx="16" cy="16" r="12" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M13 10.5l9 5.5-9 5.5z" fill="currentColor"/>',
  book: '<path d="M5 6c4-2 8-2 11 1 3-3 7-3 11-1v20c-4-2-8-2-11 1-3-3-7-3-11-1z M16 7v20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>',
  chart: '<path d="M4 27h24M7 22l6-7 5 4 9-11" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/>',
  code: '<path d="M11 9l-7 7 7 7M21 9l7 7-7 7M18 6l-4 20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/>',
  brief: '<rect x="4" y="10" width="24" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M12 10V6h8v4M4 17h24" fill="none" stroke="currentColor" stroke-width="2.2"/>',
  img: '<rect x="4" y="6" width="24" height="20" rx="3" fill="none" stroke="currentColor" stroke-width="2.2"/><circle cx="11" cy="12" r="2.5" fill="currentColor"/><path d="M4 23l8-7 6 5 4-3 6 5" fill="none" stroke="currentColor" stroke-width="2.2"/>',
  search: '<circle cx="14" cy="14" r="8.5" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M20.5 20.5L28 28" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/>',
  head: '<path d="M6 19v-3a10 10 0 0 1 20 0v3" fill="none" stroke="currentColor" stroke-width="2.2"/><rect x="4" y="18" width="6" height="8" rx="2" fill="none" stroke="currentColor" stroke-width="2.2"/><rect x="22" y="18" width="6" height="8" rx="2" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M25 26c0 2-3 3-7 3" fill="none" stroke="currentColor" stroke-width="2"/>',
  bookmark: '<path d="M8 4h16v24l-8-6-8 6z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/>',
  share: '<circle cx="24" cy="7" r="3.5" fill="none" stroke="currentColor" stroke-width="2.2"/><circle cx="8" cy="16" r="3.5" fill="none" stroke="currentColor" stroke-width="2.2"/><circle cx="24" cy="25" r="3.5" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M11 14.5l10-5.5M11 17.5l10 5.5" stroke="currentColor" stroke-width="2.2"/>',
};
const icon = (k, s = 44, col = '#9feaff') => `<svg width="${s}" height="${s}" viewBox="0 0 32 32" style="color:${col};filter:drop-shadow(0 0 8px ${col})">${ico[k]}</svg>`;
function sphere(x, y, r, intensity = 1) {
  return `<div class="abs" style="left:${x - r * 2}px;top:${y - r * 2}px;width:${r * 4}px;height:${r * 4}px;border-radius:50%;
      background:radial-gradient(circle,rgba(34,211,255,${.35 * intensity}) 0%,rgba(47,123,255,${.15 * intensity}) 30%,transparent 62%)"></div>
    <div class="abs" style="left:${x - r}px;top:${y - r}px;width:${r * 2}px;height:${r * 2}px;border-radius:50%;
      background:radial-gradient(circle at 38% 32%,#ffffff 0%,#bff4ff 8%,#22d3ff 26%,#2f6bff 55%,#2a1a7a 80%,#0a0a2a 100%);
      box-shadow:0 0 ${r * .8}px rgba(34,211,255,.9),0 0 ${r * 2}px rgba(47,123,255,.6),inset -${r * .25}px -${r * .3}px ${r * .5}px rgba(30,0,90,.7),inset ${r * .1}px ${r * .1}px ${r * .3}px rgba(255,255,255,.5)"></div>
    <svg class="abs" style="left:${x - r * 1.6}px;top:${y - r * 1.6}px" width="${r * 3.2}" height="${r * 3.2}" viewBox="0 0 100 100">
      <g fill="none" stroke="rgba(160,240,255,.55)" stroke-width=".35">
        <ellipse cx="50" cy="50" rx="46" ry="14" transform="rotate(-18 50 50)"/>
        <ellipse cx="50" cy="50" rx="44" ry="20" transform="rotate(32 50 50)" stroke="rgba(170,140,255,.5)"/>
        <ellipse cx="50" cy="50" rx="48" ry="9" transform="rotate(78 50 50)" stroke-dasharray="2 3"/>
      </g></svg>`;
}
function neural(cx, cy, rMin, rMax, nodes = 34) {
  const pts = [];
  for (let i = 0; i < nodes; i++) {
    const a = rnd() * Math.PI * 2, d = rMin + rnd() * (rMax - rMin);
    pts.push([cx + Math.cos(a) * d, cy + Math.sin(a) * d * 1.15]);
  }
  let s = `<svg class="abs" style="left:0;top:0" width="1080" height="1920"><defs>
    <linearGradient id="ln" x1="0" x2="1"><stop offset="0" stop-color="#22d3ff" stop-opacity=".9"/><stop offset="1" stop-color="#8b5cff" stop-opacity=".2"/></linearGradient>
    <filter id="gl"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><g filter="url(#gl)">`;
  pts.forEach((p, i) => {
    if (i % 3 === 0) s += `<line x1="${cx}" y1="${cy}" x2="${p[0]}" y2="${p[1]}" stroke="url(#ln)" stroke-width="1.4" opacity=".55"/>`;
    const near = pts.map((q, j) => [Math.hypot(q[0] - p[0], q[1] - p[1]), j]).sort((a, b) => a[0] - b[0]).slice(1, 3);
    near.forEach(([d, j]) => s += `<line x1="${p[0]}" y1="${p[1]}" x2="${pts[j][0]}" y2="${pts[j][1]}" stroke="rgba(120,210,255,.45)" stroke-width="1.2"/>`);
  });
  pts.forEach((p) => { const r = 3 + rnd() * 6; s += `<circle cx="${p[0]}" cy="${p[1]}" r="${r}" fill="#bff4ff"/><circle cx="${p[0]}" cy="${p[1]}" r="${r * 2.6}" fill="none" stroke="rgba(34,211,255,.35)"/>`; });
  return s + '</g></svg>';
}
function trail(d, w = 4, col = '#22d3ff', op = 1) {
  return `<svg class="abs" style="left:0;top:0" width="1080" height="1920"><defs><filter id="tb${seed}"><feGaussianBlur stdDeviation="6"/></filter></defs>
   <path d="${d}" fill="none" stroke="${col}" stroke-width="${w * 4}" opacity="${.35 * op}" filter="url(#tb${seed})" stroke-linecap="round"/>
   <path d="${d}" fill="none" stroke="#e8fbff" stroke-width="${w * .6}" opacity="${op}" stroke-linecap="round"/>
   <path d="${d}" fill="none" stroke="${col}" stroke-width="${w}" opacity="${.8 * op}" stroke-linecap="round"/></svg>`;
}
const card = (x, y, w, h, inner, tf = '', extra = '') =>
  `<div class="abs glass" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;transform:${tf};overflow:hidden;${extra}">${inner}</div>`;

// ---------- scenes ----------
const scenes = {
s1() {
  particles({count: 260, cy: 700, streaks: 90, bokeh: 10});
  document.getElementById('floor').style.display = 'none';
  add(neural(540, 700, 230, 560, 40));
  add(sphere(540, 700, 150, 1.2));
  add(`<div class="abs tag" style="top:150px;width:100%;text-align:center">AI · INCOME · FUTURE</div>`);
  // hero 7 with deep extrusion
  let sh = [];
  for (let i = 1; i <= 40; i++) sh.push(`${i * .5}px ${i}px 0 hsl(214,75%,${26 - i * .5}%)`);
  sh.push('0 60px 60px rgba(0,0,0,.8)', '0 0 120px rgba(34,211,255,.45)');
  add(`<div class="abs" style="left:0;right:0;top:980px;text-align:center;font-weight:700;font-size:430px;line-height:.9;direction:ltr;transform:perspective(900px) rotateX(14deg) rotateY(-12deg)">
     <span class="abs" style="left:0;right:0;color:#0b2747;text-shadow:${sh.join(',')}">7</span>
     <span style="position:relative;background:linear-gradient(170deg,#fff 0%,#d9f4ff 28%,#78c4ee 46%,#16467a 50%,#a8e2ff 64%,#fff 82%,#8ccff5 100%);-webkit-background-clip:text;color:transparent">7</span></div>`);
  add(`<div class="abs" style="left:0;right:0;top:1395px;display:flex;flex-direction:column;align-items:center;gap:8px">
     <div class="h-title ar" style="font-size:96px">طرق لبناء مصدر دخل</div>
     <div class="ar" style="font-size:58px;font-weight:600;color:#9feaff;text-shadow:0 0 24px rgba(34,211,255,.6)">باستخدام الذكاء الاصطناعي</div>
     <div class="rule" style="margin-top:22px;width:560px"></div></div>`);
  add('<div class="sweep" style="opacity:.6"></div>');
},
s2() {
  particles({count: 160, cy: 760, bokeh: 12});
  // orbit path
  add(`<svg class="abs" style="left:0;top:0" width="1080" height="1920"><ellipse cx="540" cy="820" rx="500" ry="150" fill="none" stroke="rgba(34,211,255,.35)" stroke-width="2" stroke-dasharray="6 10"/>
       <path d="M980 760 l26 -6 -10 24" fill="none" stroke="#22d3ff" stroke-width="3"/></svg>`);
  // central monitor
  add(`<div class="abs" style="left:250px;top:560px;width:580px;height:380px;transform:perspective(1200px) rotateY(-14deg) rotateX(6deg)">
    <div class="glass glow-c" style="position:absolute;inset:0;border-radius:24px;padding:28px;background:linear-gradient(160deg,rgba(20,40,80,.85),rgba(8,12,24,.9))">
      <div style="display:flex;gap:10px;margin-bottom:22px"><span class="dot" style="background:#8b5cff;box-shadow:0 0 10px #8b5cff"></span><span class="dot"></span><span class="dot" style="background:#fff;box-shadow:0 0 10px #fff"></span></div>
      <div class="ar" style="font-size:30px;font-weight:600;margin-bottom:16px">مساعدك الذكي جاهز</div>
      <div style="height:16px;width:85%;border-radius:8px;background:rgba(255,255,255,.14);margin:10px 0 10px auto"></div>
      <div style="height:16px;width:65%;border-radius:8px;background:rgba(255,255,255,.1);margin:10px 0 10px auto"></div>
      <div style="display:flex;gap:14px;align-items:flex-end;height:120px;margin-top:26px;direction:ltr">${[40,62,50,85,70,100,92].map(h => `<div class="bar" style="flex:1;height:${h}%"></div>`).join('')}</div>
    </div>
    <div style="position:absolute;left:250px;top:380px;width:80px;height:70px;background:linear-gradient(180deg,#1a2a44,#0a0f1a)"></div>
    <div style="position:absolute;left:150px;top:448px;width:280px;height:14px;border-radius:8px;background:#22344f;box-shadow:0 0 30px rgba(34,211,255,.4)"></div></div>`);
  // floating panels
  add(card(60, 360, 300, 170, `<div style="padding:22px">${icon('chat', 40)}<div class="ar lbl" style="margin-top:10px">محادثة ذكية</div><div style="height:10px;width:80%;background:rgba(255,255,255,.15);border-radius:6px;margin:14px 0 0 auto"></div></div>`, 'perspective(900px) rotateY(22deg)'));
  add(card(730, 330, 290, 190, `<div style="padding:22px;direction:ltr">${icon('chart', 40)}<div class="big" style="font-size:46px;color:#9feaff">+248%</div><div class="ar lbl">نمو الأرباح</div></div>`, 'perspective(900px) rotateY(-24deg)'));
  add(card(40, 980, 260, 170, `<div style="padding:22px">${icon('img', 40, '#c3adff')}<div class="ar lbl" style="margin-top:10px">توليد الصور</div></div>`, 'perspective(900px) rotateY(26deg) rotateX(8deg)', 'opacity:.85'));
  add(card(790, 990, 250, 170, `<div style="padding:22px">${icon('bolt', 40)}<div class="ar lbl" style="margin-top:10px">أتمتة فورية</div></div>`, 'perspective(900px) rotateY(-26deg) rotateX(8deg)', 'opacity:.85'));
  // kinetic words (karaoke highlight)
  add(`<div class="abs ar" style="left:0;right:0;top:1250px;display:flex;flex-direction:column;align-items:center;gap:6px">
    <div style="font-size:84px;font-weight:600;color:rgba(255,255,255,.5)">مصدر دخل</div>
